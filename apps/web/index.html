<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutlab — AI video editor</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%230b0d12' width='64' height='64' rx='12'/><path fill='%23e8c36a' d='M12 40V24l16 8-16 8zm22-16h4v24h-4zm8 4h4v16h-4zm8 4h4v8h-4z'/></svg>" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect fill="#0b0d12" width="64" height="64" rx="12"/><path fill="#e8c36a" d="M12 40V24l16 8-16 8zm22-16h4v24h-4zm8 4h4v16h-4zm8 4h4v8h-4z"/></svg>
        CUTLAB
      </div>
      <div class="sep"></div>
      <button class="btn" id="import">Import</button>
      <input id="file" type="file" accept="video/*,audio/*" />
      <button class="btn icon ghost" id="play" title="Space">▶</button>
      <div class="tc" id="tc">00:00:00</div>
      <div class="grow"></div>
      <span class="status" id="status">No clip</span>
      <button class="btn ghost" id="captions">Auto captions</button>
      <button class="btn ghost" id="highlights">Viral highlights</button>
      <button class="btn ghost" id="clips">Cut clips</button>
      <button class="btn" id="export">Export MP4</button>
    </header>

    <div class="workspace">
      <aside class="col">
        <div class="hd">Media · overlays</div>
        <div class="media-list" id="bin"></div>
      </aside>

      <section class="col stage-wrap">
        <div class="stage">
          <div class="frame" id="frame">
            <div class="empty" id="empty">Import a video. Cutlab owns the timeline. HyperFrames is only the motion overlay engine.</div>
            <video id="preview" playsinline></video>
            <iframe id="overlay" class="hidden" title="Cutlab overlay"></iframe>
            <div class="caption-layer"><div id="cue" class="cue hidden"></div></div>
          </div>
        </div>
      </section>

      <aside class="col">
        <div class="hd">AI</div>
        <div class="ai-actions">
          <button class="btn ghost" data-p="add captions">Captions</button>
          <button class="btn ghost" data-p="find highlights">Highlights</button>
          <button class="btn ghost" data-p="add title sting">Title sting</button>
          <button class="btn ghost" data-p="export mp4">Export</button>
        </div>
        <div class="ai-log" id="log"></div>
        <div class="prompt">
          <input id="prompt" placeholder="add captions · find highlights · export" />
          <button class="btn" id="go">Go</button>
        </div>
      </aside>
    </div>

    <footer class="timeline">
      <div class="ruler" id="ruler">
        <div id="ruler-inner" style="margin-left:88px;position:relative;height:100%">
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
      <div class="tracks" id="tracks">
        <div class="playhead" id="playhead"></div>
        <div class="track"><label>V1</label><div class="lane" id="lane-v"></div></div>
        <div class="track"><label>Captions</label><div class="lane" id="lane-c"></div></div>
        <div class="track"><label>Motion</label><div class="lane" id="lane-g"></div></div>
        <div class="track"><label>Hits</label><div class="lane" id="lane-h"></div></div>
      </div>
    </footer>
  </div>
  <script type="module" src="/js/app.js"></script>
  <script>
    document.querySelectorAll(".ai-actions [data-p]").forEach((b) => {
      b.addEventListener("click", () => {
        document.getElementById("prompt").value = b.dataset.p;
        document.getElementById("go").click();
      });
    });
    const empty = document.getElementById("empty");
    const preview = document.getElementById("preview");
    preview.addEventListener("loadeddata", () => empty.classList.add("hidden"));
  </script>
</body>
</html>
