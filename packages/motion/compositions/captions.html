<!doctype html>
<html>
  <body>
    <template>
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          color: #e8ecf4;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #10131c;
        }
        .kicker {
          position: absolute;
          left: 160px;
          top: 220px;
          margin: 0;
          font-size: 22px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #e8c36a;
          will-change: transform, opacity;
        }
        .line {
          position: absolute;
          left: 160px;
          right: 160px;
          top: 300px;
          margin: 0;
          font-size: 72px;
          font-weight: 800;
          line-height: 1.15;
          will-change: transform, opacity;
        }
        .pill {
          position: absolute;
          left: 160px;
          bottom: 120px;
          padding: 18px 28px;
          border-radius: 16px;
          background: rgba(11, 13, 18, 0.88);
          border: 1px solid #3d3420;
          font-size: 36px;
          font-weight: 700;
          color: #e8c36a;
          will-change: transform, opacity;
        }
      </style>
      <div
        id="root"
        data-composition-id="captions-overlay"
        data-width="1920"
        data-height="1080"
        data-duration="3"
      >
        <section id="caption-scene" class="clip" data-start="0" data-duration="3" data-track-index="1">
          <div class="fill"></div>
          <p id="cap-kicker" class="kicker">Auto captions</p>
          <h2 id="cap-line" class="line">Whisper lands on the same timeline JSON. Burn with real FFmpeg, not a fake overlay screenshot.</h2>
          <div id="cap-pill" class="pill">“cutlab captions take.mp4”</div>
        </section>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cap-kicker", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.08);
        tl.fromTo("#cap-line", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.18);
        tl.fromTo("#cap-pill", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.55);
        window.__timelines["captions-overlay"] = tl;
      </script>
    </template>
  </body>
</html>
